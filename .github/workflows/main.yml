name: CI/CD Pipeline with Direct Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Azure Login
      - name: Azure Login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Execute the Update Script on VMSS instances
      - name: Deploy to Azure VMSS
        run: |
          az vmss extension set \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ secrets.VMSS_NAME }} \
            --vmss-name ${{ secrets.VMSS_NAME }} \
            --publisher Microsoft.Azure.Extensions \
            --version 2.0 \
            --settings '{"commandToExecute": "sudo bash /home/azureuser/WeCloudData-ChatBot/update.sh"}'

