name: CI/CD Pipeline with Direct Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache Python dependencies
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Start ChromaDB, FastAPI (Uvicorn), and Streamlit
      - name: Start services
        run: |
          nohup chroma run --path chromadb --host 0.0.0.0 --port 8000 > chroma.log 2>&1 &
          nohup uvicorn backend:app --host 0.0.0.0 --port 5000 --reload > uvicorn.log 2>&1 &
          nohup streamlit run chatbot.py --server.port=8051 --server.headless true > streamlit.log 2>&1 &

      # Wait for services to start and check if they are running
      - name: Check if services are running
        run: |
          sleep 10  # Give processes time to start
          ss -tulnp | grep -E '8000|5000|8051'

