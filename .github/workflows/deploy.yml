name: Deploy to VM

on:
  push:
    branches:
      - main  # Trigger deployment on changes to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout the repository
        uses: actions/checkout@v2

      # Step 2: Set up SSH key for VM connection
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Step 3: Run the custom deployment script on VM
      - name: Run the custom deployment script
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP_ADDRESS }} << 'EOF'
            # Step 1: Activate the environment 
            source env/bin/activate  # Adjust the path to your virtual environment
            killall chroma uvicorn streamlit
            # Step 2: Navigate to the repository directory
            cd WeCloudData-ChatBot  

            # Step 3: Run the custom script
            sudo systemctl restart all-services.service
            #bash ./run.sh
          EOF
