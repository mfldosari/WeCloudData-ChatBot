name: Deploy to VM

on:
  push:
    branches:
      - main  # Trigger deployment on changes to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout the repository
        uses: actions/checkout@v2

      # Step 2: Set up SSH key for VM connection
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Step 3: Run the custom deployment script on VM
      - name: Run the custom deployment script
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP_ADDRESS }} << 'EOF'
            # Step 1: Activate the environment
            source env/bin/activate 

            # Step 2: Stop running processes (Chroma, Uvicorn, Streamlit)
            killall chroma uvicorn streamlit

            # Step 3: Navigate to the repository directory
            cd /home/azureuser/WeCloudData-ChatBot  # Adjust this path if necessary

            # Step 4: Pull the latest changes from GitHub
            git pull origin main

            # Step 5: Install dependencies (if needed)
            pip install -r requirements.txt

            # Step 6: Restart the service (if needed)
            sudo systemctl restart all-services.service

            # Optional: Uncomment below if you want to run the script directly
            # bash ./run.sh
          EOF
