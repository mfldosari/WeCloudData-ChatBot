name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP_ADDRESS }} << 'EOF'
            sudo systemctl stop all-services.service

            # Kill running processes safely
            pkill -f "chroma" || true
            pkill -f "uvicorn" || true
            pkill -f "streamlit" || true

            # Navigate to project directory
            cd /home/azureuser/WeCloudData-ChatBot

            # Ensure SSH authentication for GitHub
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/id_rsa

            # Pull latest changes using SSH
            git pull origin main

            # Activate the existing virtual environment
            source /home/azureuser/env/bin/activate

            # Install dependencies safely
            pip install --upgrade pip
            pip install -r requirements.txt

            # Restart the service
            sudo systemctl restart all-services.service
            sleep 5
            sudo systemctl status all-services.service --no-pager
          EOF
